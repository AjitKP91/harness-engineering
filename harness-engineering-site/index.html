<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Harness Engineering — Interactive Study Guide</title>
    <meta
      name="description"
      content="A zero-to-mastery interactive textbook and simulator suite explaining how modern AI coding agents work under the hood."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem("color-scheme");
        if (saved === "light" || saved === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = saved;
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="progress" aria-hidden="true"></div>
    <div id="app"></div>

    <!-- Command Palette Dialog -->
    <dialog id="search-dialog" class="modal-dialog search-dialog" closedby="any" aria-labelledby="search-dialog-title">
      <div class="search-modal-surface">
        <div class="search-modal-header">
          <h2 id="search-dialog-title" class="sr-only">Search Study Guide</h2>
          <div class="search-input-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </svg>
            <input
              id="search-modal-input"
              type="search"
              placeholder="Search 42 chapters, sections, interactive labs, or glossary terms…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="search-close-btn" class="icon-btn" aria-label="Close search">Esc</button>
          </div>
        </div>
        <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
        <div class="search-modal-footer">
          <span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
          <span><kbd>↵</kbd> Open</span>
          <span><kbd>Esc</kbd> Close</span>
        </div>
      </div>
    </dialog>

    <!-- Diagram Zoom & Pan Lightbox -->
    <dialog id="diagram-dialog" class="modal-dialog diagram-dialog" closedby="any" aria-labelledby="diagram-dialog-title">
      <div class="diagram-modal-surface">
        <div class="diagram-modal-toolbar">
          <div class="diagram-modal-title-wrap">
            <span class="mermaid-badge">Architecture Diagram</span>
            <h2 id="diagram-dialog-title" class="diagram-modal-title">Diagram Viewer</h2>
          </div>
          <div class="diagram-modal-controls">
            <button type="button" class="btn-ghost btn-sm" id="diagram-zoom-out" aria-label="Zoom out">−</button>
            <span id="diagram-zoom-label" class="diagram-zoom-label">100%</span>
            <button type="button" class="btn-ghost btn-sm" id="diagram-zoom-in" aria-label="Zoom in">+</button>
            <button type="button" class="btn-ghost btn-sm" id="diagram-zoom-reset">Reset</button>
            <button type="button" class="btn-ghost btn-sm" id="diagram-close-btn" aria-label="Close diagram viewer">Close</button>
          </div>
        </div>
        <div id="diagram-viewport" class="diagram-viewport">
          <div id="diagram-canvas" class="diagram-canvas"></div>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
